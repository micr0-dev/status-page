# --- iDRAC 9 / Redfish (mgmt net 10.135.4.2, self-signed cert) ---
# Creds rotated 2026-10-06: password NO LONGER has surrounding spaces;
# base64 = printf 'status-read:<pw>' | base64 -w0 (mirrored in gatus.env).
# Probe cadence is staggered (10m..15m) so Gatus never bursts the BMC.
  - name: idrac-bmc
    group: hardware
    alerts:
      - type: custom
    url: https://169.254.1.1/redfish/v1/
    interval: 10m
    # Probed via the OS-to-iDRAC passthrough link (iface `idrac`, 169.254.1.2
    # -> 169.254.1.1) — the mgmt net (10.135.4.2) blacklisted this box after
    # failed logins; passthrough has its own MAC/IP and is unaffected.
    client:
      insecure: true
      timeout: 20s
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 8000"
      - "[BODY].RedfishVersion != null"
  - name: idrac-system-health
    group: hardware
    alerts:
      - type: custom
    url: https://169.254.1.1/redfish/v1/Systems/System.Embedded.1
    interval: 11m
    client:
      insecure: true
      timeout: 20s
    headers:
      Authorization: Basic ${GATUS_IDRAC_BASIC}
    conditions:
      - "[STATUS] == 200"
      - "[BODY].Status.Health == OK"
      - "[BODY].PowerState == On"
  - name: idrac-manager-health
    group: hardware
    alerts:
      - type: custom
    url: https://169.254.1.1/redfish/v1/Managers/iDRAC.Embedded.1
    interval: 12m
    client:
      insecure: true
      timeout: 20s
    headers:
      Authorization: Basic ${GATUS_IDRAC_BASIC}
    conditions:
      - "[STATUS] == 200"
      - "[BODY].Status.Health == OK"
  - name: idrac-thermal
    group: hardware
    alerts:
      - type: custom
    url: https://169.254.1.1/redfish/v1/Chassis/System.Embedded.1/Thermal
    interval: 13m
    client:
      insecure: true
      timeout: 20s
    headers:
      Authorization: Basic ${GATUS_IDRAC_BASIC}
    # NOTE: on iDRAC 7.x / Redfish 1.17 the Thermal+Power resources live under
    # Chassis/... (root /Thermal /Power are gone — SYS403).
    # Sensor order observed 2026-10-05: [0]=CPU1 [1]=CPU2 [2]=Inlet [3]=GPU8
    # [4]=Exhaust. Index [2] = inlet temp; threshold 45C (normally 24C).
    conditions:
      - "[STATUS] == 200"
      - "[BODY].Fans[0].Status.Health == OK"
      - "[BODY].Temperatures[2].ReadingCelsius < 45"
  - name: idrac-power
    group: hardware
    alerts:
      - type: custom
    url: https://169.254.1.1/redfish/v1/Chassis/System.Embedded.1/Power
    interval: 14m
    client:
      insecure: true
      timeout: 20s
    headers:
      Authorization: Basic ${GATUS_IDRAC_BASIC}
    # Dual PSU (PS1+PS2, both Health=OK at probe time; ~210W consumed).
    conditions:
      - "[STATUS] == 200"
      - "[BODY].PowerSupplies[0].Status.Health == OK"
      - "[BODY].PowerSupplies[1].Status.Health == OK"
      - "[BODY].PowerControl[0].PowerConsumedWatts > 10"

  - name: idrac-chassis-health
    group: hardware
    alerts:
      - type: custom
    url: https://169.254.1.1/redfish/v1/Chassis/System.Embedded.1
    interval: 15m
    client:
      insecure: true
      timeout: 20s
    headers:
      Authorization: Basic ${GATUS_IDRAC_BASIC}
    # HealthRollup aggregates thermal+power+storage+firmware across the chassis.
    conditions:
      - "[STATUS] == 200"
      - "[BODY].Status.HealthRollup == OK"
      - "[BODY].PowerState == On"

  - name: "xm2xl5qvso5asx54enwxxgjqkclspmgmf7oijquczmj2ywj4nnffssqd.onion — micr0byte dev site"
    group: onion
    alerts:
      - type: custom
    url: http://xm2xl5qvso5asx54enwxxgjqkclspmgmf7oijquczmj2ywj4nnffssqd.onion/
    interval: 10m
    # Tor circuits are slow: 30s timeout, generous response-time condition.
    client:
      proxy-url: socks5://127.0.0.1:9050
      timeout: 30s
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*<title>micr0byte*)"
      - "[RESPONSE_TIME] < 25000"

  - name: onion-vhost-internal
    group: onion
    alerts:
      - type: custom
    url: http://127.0.0.1:8080/
    interval: 10m
    # Same vhost apache serves for the onion — separates "Tor path broken"
    # from "site broken" (needs the onion Host header).
    headers:
      Host: xm2xl5qvso5asx54enwxxgjqkclspmgmf7oijquczmj2ywj4nnffssqd.onion
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*<title>micr0byte*)"

