    url: https://ventboard.site/
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY] == pat(*<title>Vent Board*)"
      - "[RESPONSE_TIME] < 5000"
      - "[CERTIFICATE_EXPIRATION] > 720h"

