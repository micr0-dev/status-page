      interval: 26h

# ============================================================================

# maintenance: silences ALL alerts (pushed + polled) Tue 02:00-04:00 America/New_York
# around the weekly reboot-timer (reboot-timer.service on AltTron).
maintenance:
  enabled: true
  start: "02:00"
  duration: 2h
  timezone: "America/New_York"
  every:
    - "Tuesday"
